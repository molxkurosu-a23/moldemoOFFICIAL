<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>動画再生テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f0e8;color:#302d27;font-family:system-ui,-apple-system,sans-serif;text-align:center}
main{max-width:680px;margin:0 auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}
h1{font-size:24px;margin:4px 0 8px}.desc{font-size:14px;color:#666;margin:0 0 18px}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
button{border:0;border-radius:12px;padding:15px 8px;background:#426b4b;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
video{display:block;width:100%;max-height:55vh;background:#000;border-radius:12px;margin:12px 0;object-fit:contain}
#status{white-space:pre-wrap;text-align:left;background:#f4f4f4;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;overflow-wrap:anywhere;min-height:90px}
.small{font-size:12px;color:#777;margin-top:12px}
</style>
</head>
<body><main>
<h1>動画再生テスト</h1>
<p class="desc">ゲームを起動せず、動画だけを確認します。</p>
<div class="buttons">
<button onclick="playVideo(5)">5投動画</button>
<button onclick="playVideo(6)">6投動画</button>
<button onclick="playVideo(7)">7投動画</button>
</div>
<video id="v" controls playsinline webkit-playsinline preload="none"></video>
<div id="status">再生したい動画のボタンを押してください。</div>
<p class="small">動画ファイルは video_debug.html と同じ階層に置いてください。</p>
</main>
<script>
const v=document.getElementById('v');
const statusEl=document.getElementById('status');
function log(s){statusEl.textContent += '\n'+s;}
function playVideo(n){
 const name=n+'tou.mp4';
 const url=new URL(name,location.href).href;
 statusEl.textContent='選択：'+name+'\n読み込み先：'+url+'\n読み込み開始…';
 v.pause();v.removeAttribute('src');v.load();
 v.src=name;v.load();
 v.onerror=()=>{const e=v.error;log('動画エラー：'+(e?('code='+e.code+' / '+({1:'ABORTED',2:'NETWORK',3:'DECODE',4:'SRC_NOT_SUPPORTED'}[e.code]||'不明')):'詳細不明'));};
 v.onloadedmetadata=()=>log('メタデータ取得成功：'+v.videoWidth+'×'+v.videoHeight+' / duration='+v.duration);
 v.oncanplay=()=>log('再生準備完了（canplay）');
 v.onplaying=()=>log('再生開始を確認');
 v.onended=()=>log('再生終了');
 const p=v.play();
 if(p&&p.then){p.then(()=>log('play() 成功')).catch(e=>log('play() 失敗：'+e.name+' / '+e.message));}
}
</script></body></html>
